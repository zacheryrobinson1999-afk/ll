kind = "mobile"
previewPath = "/ltc-mobile/"
title = "LTC Engineering Tools"
description = "A modern Android-ready engineering utility rebuilt from the legacy LTC crane calculator. Includes PSI and BAR conversion, length and temperature tools, crane calculation helpers, recent calculations, and a polished industrial interface."
version = "1.0.0"
id = "artifacts/ltc-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/ltc-mobile/" ]
localPort = 20500

[services.development]
run = "pnpm --filter @workspace/ltc-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ltc-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ltc-mobile", "run", "serve" ]

[services.env]
PORT = "20500"
BASE_PATH = "/ltc-mobile/"
